<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #0B0A14; font-family: 'Lexend', 'Segoe UI', system-ui, sans-serif; }
    a { color: #9B82FF; } a:hover { color: #C3B0FF; }
  </style>
</helmet>
<div style="width: 540px; height: 960px; background: #100E1B; padding: 56px 44px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <svg viewBox="0 0 100 100" width="30" height="30" aria-label="Questa">
      <circle cx="50" cy="50" r="33" fill="none" stroke="#7C5CFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="158.4 48.9" transform="rotate(87.5 50 50)"></circle>
      <path d="M70 70 L86 86" fill="none" stroke="#7C5CFF" stroke-width="13" stroke-linecap="round"></path>
    </svg>
    <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: #F5F3FF;">questa</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 30px;">
    <div style="position: relative; width: 252px; height: 252px; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 100 100" width="252" height="252" style="position: absolute; inset: 0;" aria-hidden="true">
        <circle cx="50" cy="50" r="33" fill="none" stroke="#2B2354" stroke-width="13" stroke-linecap="round" stroke-dasharray="158.4 48.9" transform="rotate(87.5 50 50)"></circle>
        <circle cx="50" cy="50" r="33" fill="none" stroke="#7C5CFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="98.2 207.3" transform="rotate(87.5 50 50)"></circle>
        <path d="M70 70 L86 86" fill="none" stroke="#2B2354" stroke-width="13" stroke-linecap="round"></path>
      </svg>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 52px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: #F5F3FF;">3,4</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.18em; color: #8279AB;">QUESTÕES</span>
      </div>
    </div>
    <div style="font-family: 'Lexend', sans-serif; font-size: 19px; line-height: 1.5; color: #ABA3D1; text-align: center; max-width: 340px; text-wrap: pretty;">
      Geometria vale <span style="color: #F5F3FF; font-weight: 500;">3,4 questões</span> na próxima prova. Você se deu nota 3. Gasta 4h aqui.
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px;">
    <div style="font-family: 'Fredoka', sans-serif; font-size: 46px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; color: #F5F3FF; text-wrap: pretty;">Você não precisa estudar tudo.</div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <span style="font-family: 'Lexend', sans-serif; font-size: 16px; color: #9B82FF;">Spoiler da sua prova.</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; color: #675AB9;">[SEU LINK]</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
