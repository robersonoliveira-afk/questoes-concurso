<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>

  <style>

<div style="width: 600px; height: 600px; background: #100E1B; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
  <div style="display: flex; align-items: center; gap: 40px;">
    <svg viewBox="0 0 100 100" width="150" height="150" style="flex: none;" aria-label="Questa">
      <circle cx="50" cy="50" r="33" fill="none" stroke="#2B2354" stroke-width="13" stroke-linecap="round" stroke-dasharray="158.4 48.9" transform="rotate(87.5 50 50)"></circle>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#7C5CFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="118.8 207.3" transform="rotate(87.5 50 50)"></circle>
      <path d="M70 70 L86 86" fill="none" stroke="#7C5CFF" stroke-width="13" stroke-linecap="round"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: #675AB9; width: 16px;">1</span>
        <span style="font-family: 'Lexend', sans-serif; font-size: 16px; color: #F5F3FF;">Lê as provas passadas</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: #675AB9; width: 16px;">2</span>
        <span style="font-family: 'Lexend', sans-serif; font-size: 16px; color: #F5F3FF;">Calcula quanto cada assunto vale</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: #675AB9; width: 16px;">3</span>
        <span style="font-family: 'Lexend', sans-serif; font-size: 16px; color: #F5F3FF;">Vira quantas horas estudar de cada</span>
      </div>
    </div>
  </div>

  <div style="font-family: 'Fredoka', sans-serif; font-size: 42px; font-weight: 600; line-height: 1.12; letter-spacing: -0.01em; color: #F5F3FF; text-wrap: pretty;">Estudar tudo não cabe. Estudar o que vale, cabe.</div>

  <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(245,243,255,0.08); padding-top: 22px;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
        <circle cx="50" cy="50" r="33" fill="none" stroke="#7C5CFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="158.4 48.9" transform="rotate(87.5 50 50)"></circle>
        <path d="M70 70 L86 86" fill="none" stroke="#7C5CFF" stroke-width="13" stroke-linecap="round"></path>
      </svg>
      <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #F5F3FF;">questa</span>
    </div>
    <span style="font-family: 'Lexend', sans-serif; font-size: 14px; color: #9B82FF;">Spoiler da sua prova.</span>
  </div>
